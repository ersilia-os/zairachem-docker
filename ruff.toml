indent-width = 2
preview = true
target-version = "py310"

lint.select = [
  "F",  # Pyflakes
  "E4",  # import-statement style (E401 multiple imports, E402 import not at top)
  "E9",  # syntax errors
  "I",  # isort: sorted imports
  "W",  # pycodestyle warnings
  "W6",
  "E71",
  "E72",
  "E112",   # no-indented-block
  "E113",   # unexpected-indentation
  # "E124",
  "E203",   # whitespace-before-punctuation
  "E272",   # multiple-spaces-before-keyword
  "E275",   # missing-whitespace-after-keyword
  "E303",   # too-many-blank-lines
  "E304",   # blank-line-after-decorator
  # "E502",
  "E702",   # multiple-statements-on-one-line-semicolon
  "E703",   # useless-semicolon
  "E731",   # lambda-assignment
  "W191",   # tab-indentation
  "W291",   # trailing-whitespace
  "W293",   # blank-line-with-whitespace
  "UP039",  # unnecessary-class-parentheses
  "C416",   # unnecessary-comprehension
  "RET506", # superfluous-else-raise
  "RET507", # superfluous-else-continue
  "A",      # builtin-variable-shadowing, builtin-argument-shadowing, builtin-attribute-shadowing
  "SIM105", # suppressible-exception
  "FURB110",# if-exp-instead-of-or-operator
  "RUF018", # assignment-in-assert
  "D101",   # undocumented-public-class
  "D102",   # undocumented-public-method
  "D103",   # undocumented-public-function
]
# Modules, packages, magic methods and __init__ need no docstring (as the org canonical config).
lint.ignore = ["D100", "D104", "D105", "D107"]

line-length = 100

exclude = [
  "docs/",
  "models/",
  "examples/",
  "extra/",
]

[lint.isort]
combine-as-imports = true

[lint.pydocstyle]
convention = "numpy"

[lint.per-file-ignores]
# Vendored upstream code (ChEMBL's structure standardizer, GHOST): kept close to its source.
"zairachem/setup/tools/chembl_structure/**" = ["D"]
"zairachem/estimate/tools/ghost/ghostml/**" = ["D"]
# Test names describe the test; pytest functions need no docstring.
"tests/**" = ["D103"]
